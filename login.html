<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Nest - Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body data-page="login">
    <header class="site-header">
      <div class="container nav-container">
        <div class="logo">Shop Nest</div>
        <nav class="main-nav">
          <a href="index.html" class="nav-link">Home</a>
          <a href="products.html" class="nav-link">Products</a>
          <a href="cart.html" class="nav-link">Cart</a>
          <a href="login.html" class="nav-link active">Login</a>
          <a href="contact.html" class="nav-link">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container form-container">
        <h1 class="section-title">Login</h1>
        
        <!-- Simple demo login form -->
        <form id="login-form" class="card">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>
          <button type="submit" class="btn primary-btn">Login</button>
          <p id="login-message" class="form-message"></p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span id="current-year"></span> Shop Nest. Demo e-commerce website for learning purposes.</p>
      </div>
    </footer>
  </body>
</html>
