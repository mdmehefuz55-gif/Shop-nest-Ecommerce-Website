<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Nest - Cart</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body data-page="cart">
    <header class="site-header">
      <div class="container nav-container">
        <div class="logo">Shop Nest</div>
        <nav class="main-nav">
          <a href="index.html" class="nav-link">Home</a>
          <a href="products.html" class="nav-link">Products</a>
          <a href="cart.html" class="nav-link active">Cart</a>
          <a href="login.html" class="nav-link">Login</a>
          <a href="contact.html" class="nav-link">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1 class="section-title">Your Cart</h1>
        <!-- Message shown when no items are in the cart -->
        <p id="cart-empty-message" class="muted">
          Your cart is currently empty. Visit the Products page to add items.
        </p>

        <!-- Cart items container -->
        <div id="cart-items" class="cart-items"></div>

        <!-- Cart summary with total price -->
        <div id="cart-summary" class="cart-summary">
          <p>
            Total:
            <span id="cart-total-price">$0.00</span>
          </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span id="current-year"></span> Shop Nest. Demo e-commerce website for learning purposes.</p>
      </div>
    </footer>
  </body>
</html>
